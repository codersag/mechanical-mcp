name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff black
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check --target-version py310 mechanical_mcp_server.py mechanical_scripts.py mechanical_postproc.py acp_mcp_server.py acp_cdb_tools.py acp_wb_scripts.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "mcp[cli]>=1.0,<2" numpy scipy pytest
      - name: Tests (no Mechanical needed)
        run: pytest -q
